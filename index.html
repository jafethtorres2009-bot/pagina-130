    $tarea = $_POST['tarea'];

    // IMAGEN

    $nombreImagen = $_FILES['imagen']['name'];
    $rutaTemporal = $_FILES['imagen']['tmp_name'];

    $carpeta = "imagenes/";

    if(!file_exists($carpeta)){
        mkdir($carpeta,0777,true);
    }

    $rutaFinal = $carpeta . $nombreImagen;

    move_uploaded_file($rutaTemporal,$rutaFinal);

    // GUARDAR EN LA BASE DE DATOS

    $sql = "INSERT INTO companeros
    (nombre, apellido, edad, correo, tarea, imagen)

    VALUES

    ('$nombre','$apellido','$edad','$correo','$tarea','$rutaFinal')";

    if($conn->query($sql)==TRUE){

        $mensaje = "Alumno guardado correctamente";

    }else{

        $mensaje = "Error al guardar";
    }

}
